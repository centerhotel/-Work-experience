<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>敬語テスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#1c2b45;--sub:#5b6b82;--line:#cfd8e3;--ok:#1f7a6d;--okbg:#e0f2ee;--ng:#b4433a;--ngbg:#fbe9e7;--accent:#1c2b45;--onaccent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a28;--card:#1b2638;--ink:#e6ecf5;--sub:#9aa9bf;--line:#2e3c54;--ok:#5fd0bd;--okbg:#17342f;--ng:#ff8f84;--ngbg:#3a2220;--accent:#e6ecf5;--onaccent:#121a28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a28;--card:#1b2638;--ink:#e6ecf5;--sub:#9aa9bf;--line:#2e3c54;--ok:#5fd0bd;--okbg:#17342f;--ng:#ff8f84;--ngbg:#3a2220;--accent:#e6ecf5;--onaccent:#121a28;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7}
main{max-width:620px;margin:0 auto;padding:24px 16px 48px}
h1,.q,.rank{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
h1{font-size:2rem;font-weight:900;margin:8px 0 4px;letter-spacing:.08em}
.lead{color:var(--sub);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.primary{background:var(--accent);color:var(--onaccent);border:0;border-radius:10px;padding:12px 22px;font-weight:700;width:100%}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px 22px;width:100%;margin-top:10px}
.modes{display:grid;gap:10px;margin-top:18px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:.85rem;margin-bottom:14px}
.tag{border:1px solid var(--line);border-radius:999px;padding:0 10px}
.q{font-size:1.35rem;font-weight:600;line-height:1.6;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1.05rem}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.ng{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
.opt:disabled{cursor:default;color:inherit}
.opt.ok:disabled{color:var(--ok)}.opt.ng:disabled{color:var(--ng)}
.fb{margin-top:16px;padding:14px;border-radius:10px;font-size:.95rem}
.fb b{display:block;font-size:1.05rem}
.fb.ok{background:var(--okbg)}.fb.ng{background:var(--ngbg)}
.rank{font-size:2.6rem;font-weight:900;text-align:center;margin:4px 0}
.score{text-align:center;color:var(--sub);margin:0 0 18px}
.rv{border-top:1px solid var(--line);padding:12px 0;font-size:.95rem}
.rv b{display:block}.rv span{color:var(--sub)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>敬語テスト</h1>
<p class="lead">尊敬語・謙譲語・丁寧語を、ビジネスの場面で使い分けられますか。</p>

<section id="start" class="card">
  <p style="margin:0">全14問・4択。答えるとすぐに解説が出ます。結果は職位で評価されます。</p>
  <div class="modes">
    <button class="primary" id="b-all">全問に挑戦する</button>
    <button class="ghost" id="b-ten" style="margin:0">ランダム7問でさくっと</button>
  </div>
</section>

<section id="quiz" class="card" hidden>
  <div class="bar"><i id="bar"></i></div>
  <div class="meta"><span id="pos"></span><span class="tag" id="cat"></span></div>
  <p class="q" id="q"></p>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb" hidden></div>
  <button class="primary" id="next" style="margin-top:14px" hidden>次の問題へ</button>
</section>

<section id="result" class="card" hidden>
  <div class="rank" id="rank"></div>
  <p class="score" id="score"></p>
  <div id="review"></div>
  <button class="primary" id="retry" style="margin-top:16px" hidden>間違えた問題だけ再挑戦</button>
  <button class="ghost" id="again">最初からやり直す</button>
</section>
</main>

<script>
var Q=[
{t:"尊敬語",q:"「食べる」の尊敬語はどれ?",a:["召し上がる","いただく","頂戴する","食べさせていただく"],e:"「召し上がる」は相手の動作を高める尊敬語。「いただく」「頂戴する」は自分側を下げる謙譲語です。"},
{t:"謙譲語",q:"「言う」の謙譲語はどれ?",a:["申し上げる","おっしゃる","言われる","ご発言なさる"],e:"「申し上げる」は自分が言うときの謙譲語。「おっしゃる」は相手が言うときの尊敬語です。"},
{t:"尊敬語",q:"取引先の方が資料を「見る」ときの言い方は?",a:["ご覧になる","拝見する","見させていただく","見られていただく"],e:"相手の動作には尊敬語の「ご覧になる」。「拝見する」は自分が見るときの謙譲語です。"},
{t:"謙譲語",q:"自分が取引先を訪問するとき、「行く」の謙譲語は?",a:["伺う","いらっしゃる","おいでになる","行かれる"],e:"「伺う」は訪問先を立てる謙譲語。「いらっしゃる」「おいでになる」は相手の動作に使う尊敬語です。"},
{t:"尊敬語",q:"お客様が在席していることを伝えるとき、「いる」の尊敬語は?",a:["いらっしゃる","おる","おります","居させる"],e:"「いらっしゃる」が尊敬語。「おる・おります」は自分側に使う謙譲語(丁重語)です。"},
{t:"言葉選び",q:"取引先の部長の発言として、適切なのはどれ?",a:["部長がおっしゃっていました","部長が申されていました","部長が言われてました","部長が申し上げていました"],e:"尊敬語は「おっしゃる」。「申す」は謙譲語なので、相手に使うと誤りです。"},
{t:"二重敬語",q:"二重敬語(敬語の重ねすぎ)になっているのはどれ?",a:["お見えになられる","お見えになる","いらっしゃる","ご覧になる"],e:"「お見えになる」+「れる」で敬語が二重になっています。「お見えになる」だけで十分です。"},
{t:"身内の扱い",q:"取引先からの電話で、不在の自社の社長について答えるには?",a:["社長の田中は外出しております","社長の田中様は外出なさっています","田中社長はいらっしゃいません","社長の田中はお出かけです"],e:"社外の人に対しては、自社の人間は社長でも身内として扱い、謙譲・丁寧表現にします。"},
{t:"言葉選び",q:"目上の人への労いとして適切なのはどれ?",a:["お疲れ様です","ご苦労様です","苦労様です","頑張ってください"],e:"「ご苦労様」は目上から目下への言葉とされがち。目上には「お疲れ様です」が無難です。"},
{t:"謙譲語",q:"「拝見する」は何敬語?",a:["謙譲語","尊敬語","丁寧語","美化語"],e:"「拝見する」は自分が見る動作をへりくだる謙譲語です。"},
{t:"尊敬語",q:"お客様が荷物を「持つ」ときの言い方として正しいのは?",a:["お持ちになる","お持ちする","持参いたす","持ってまいる"],e:"相手の動作は「お〜になる」で尊敬語に。「お〜する」は自分の動作に使う謙譲語の形です。"},
{t:"美化語",q:"「お酒」「お茶」の「お」は何に分類される?",a:["美化語","尊敬語","謙譲語","丁重語"],e:"物事を上品に言う「美化語」です。相手を高める働きはありません。"},
{t:"言葉選び",q:"上司の指示に対する返事として最も適切なのは?",a:["承知いたしました","了解しました","わかりました","オッケーです"],e:"「承知いたしました」「かしこまりました」がビジネスの定番。「了解」は目上には失礼とされることがあります。"},
{t:"謙譲語",q:"取引先から品物を「もらう」ときの謙譲語は?",a:["頂戴する","お受け取りになる","いただかれる","受領される"],e:"自分が受け取る側なので謙譲語「頂戴する」「いただく」を使います。"}
];
var $=function(i){return document.getElementById(i)};
var set=[],i=0,score=0,wrong=[],locked=false;
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function show(id){["start","quiz","result"].forEach(function(s){$(s).hidden=s!==id})}
function begin(list){set=list;i=0;score=0;wrong=[];show("quiz");ask()}
function ask(){
  var q=set[i];locked=false;
  $("pos").textContent="第"+(i+1)+"問 / "+set.length+"問";
  $("cat").textContent=q.t;$("q").textContent=q.q;
  $("bar").style.width=(i/set.length*100)+"%";
  $("fb").hidden=true;$("next").hidden=true;
  var box=$("opts");box.innerHTML="";
  shuffle(q.a.map(function(x,n){return{x:x,ok:n===0}})).forEach(function(o){
    var b=document.createElement("button");b.className="opt";b.textContent=o.x;
    b.onclick=function(){pick(b,o.ok)};box.appendChild(b);
    b.dataset.ok=o.ok?"1":"";
  });
}
function pick(btn,ok){
  if(locked)return;locked=true;
  var q=set[i];
  Array.prototype.forEach.call($("opts").children,function(b){
    b.disabled=true;if(b.dataset.ok)b.classList.add("ok");
  });
  if(!ok){btn.classList.add("ng");wrong.push(q)}else score++;
  var fb=$("fb");fb.className="fb "+(ok?"ok":"ng");
  fb.innerHTML="<b>"+(ok?"正解です":"不正解です。正解は「"+q.a[0]+"」")+"</b>"+q.e;
  fb.hidden=false;
  $("next").textContent=i+1<set.length?"次の問題へ":"結果を見る";
  $("next").hidden=false;$("next").focus();
}
$("next").onclick=function(){i++;if(i<set.length)ask();else finish()};
function finish(){
  var n=set.length,p=Math.round(score/n*100);
  var r=p===100?"社長":p>=80?"部長":p>=60?"主任":p>=40?"新入社員":"内定者";
  $("rank").textContent=r;
  $("score").textContent=n+"問中 "+score+"問正解("+p+"点)";
  var h="";
  wrong.forEach(function(q){h+='<div class="rv"><b>'+q.q+'</b>正解:'+q.a[0]+'<br><span>'+q.e+'</span></div>'});
  $("review").innerHTML=h||'<p style="text-align:center;margin:0">全問正解です。完璧な敬語力です。</p>';
  $("retry").hidden=!wrong.length;
  show("result");
}
$("b-all").onclick=function(){begin(shuffle(Q))};
$("b-ten").onclick=function(){begin(shuffle(Q).slice(0,7))};
$("retry").onclick=function(){begin(shuffle(wrong))};
$("again").onclick=function(){show("start")};
</script>
</body>
</html>
